<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="baseGradient" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="quillGradient" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="nibGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#C68A00"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer circle background (coin base) -->
  <circle cx="256" cy="256" r="252" fill="url(#baseGradient)"/>

  <!-- Coin outer rim highlight -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="#4CAF50" stroke-width="4" opacity="0.3"/>

  <!-- Inner coin ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.2"/>

  <!-- Shield shape (subtle, behind everything) -->
  <path d="M 256,100 L 380,155 L 380,275 Q 380,390 256,425 Q 132,390 132,275 L 132,155 Z"
        fill="url(#shieldGradient)" opacity="0.25"/>

  <!-- Ledger lines (subtle horizontal rules suggesting a ledger page) -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="160" y1="215" x2="330" y2="215"/>
    <line x1="160" y1="258" x2="315" y2="258"/>
    <line x1="160" y1="301" x2="300" y2="301"/>
    <line x1="160" y1="344" x2="280" y2="344"/>
  </g>

  <!-- Quill pen — tilted, writing from upper-right to lower-left -->
  <g transform="translate(270, 240) rotate(-25)">
    <!-- Feather vane (outer shape) -->
    <path d="M 0,-155
             C 22,-130 32,-85 28,-40
             L 18,55
             Q 10,80 0,95
             Q -10,80 -18,55
             L -28,-40
             C -32,-85 -22,-130 0,-155 Z"
          fill="url(#quillGradient)" opacity="0.95"/>

    <!-- Feather rachis (center spine) -->
    <line x1="0" y1="-145" x2="0" y2="85"
          stroke="#B8860B" stroke-width="2" opacity="0.35"/>

    <!-- Feather barb lines (left side) -->
    <g stroke="#C68A00" stroke-width="1" opacity="0.15">
      <line x1="0" y1="-120" x2="-22" y2="-105"/>
      <line x1="0" y1="-90" x2="-28" y2="-72"/>
      <line x1="0" y1="-60" x2="-30" y2="-42"/>
      <line x1="0" y1="-30" x2="-29" y2="-12"/>
      <line x1="0" y1="0" x2="-26" y2="16"/>
    </g>

    <!-- Feather barb lines (right side) -->
    <g stroke="#C68A00" stroke-width="1" opacity="0.15">
      <line x1="0" y1="-120" x2="22" y2="-105"/>
      <line x1="0" y1="-90" x2="28" y2="-72"/>
      <line x1="0" y1="-60" x2="30" y2="-42"/>
      <line x1="0" y1="-30" x2="29" y2="-12"/>
      <line x1="0" y1="0" x2="26" y2="16"/>
    </g>

    <!-- Pen nib (metal tip) -->
    <path d="M -12,55 L 0,120 L 12,55"
          fill="url(#nibGradient)"/>

    <!-- Nib slit -->
    <line x1="0" y1="65" x2="0" y2="112"
          stroke="#1B5E20" stroke-width="1.5"/>

    <!-- Nib breather hole -->
    <circle cx="0" cy="62" r="2.5" fill="#1B5E20" opacity="0.6"/>
  </g>

  <!-- Ink flourish / writing trail coming from the nib -->
  <path d="M 218,355 Q 255,335 295,342 Q 330,348 355,332"
        fill="none" stroke="#FFD700" stroke-width="3.5"
        stroke-linecap="round" opacity="0.5"/>

  <!-- Small gold dot at pen tip (ink drop) -->
  <circle cx="218" cy="355" r="4" fill="#FFD700" opacity="0.5"/>
</svg>
