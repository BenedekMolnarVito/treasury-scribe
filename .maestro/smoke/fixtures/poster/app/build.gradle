plugins { id 'com.android.application' }
// applicationId selectable: -PposterAppId=com.treasury.smokeposter.other (NG13). Default = allow-listed fake source.
android {
  namespace 'com.revolut.revolut'
  compileSdk 36
  defaultConfig {
    applicationId(project.findProperty('posterAppId') ?: 'com.revolut.revolut')
    minSdk 26; targetSdk 36; versionCode 2; versionName '2-smoke'
  }
}
