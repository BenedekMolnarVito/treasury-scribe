# Notification group-summary regression suite (21 scenarios).
# NG01 includes one batched Jev Nouls semantic check over the CDP-extracted DOM; all exact navigation/data assertions stay deterministic code checks.
# NG21 checks Android 15+ sensitive-notification/OTP redaction behavior (separate from summary fix).
# SOURCE: .maestro/smoke/plans/notif_group_summary_suite.md (deep-planner, HEAD 12c2180).
# Copied verbatim from the plan's YAML block; harness-only additions: timing_guard
# (rapid/late dedup timing preconditions -> ERROR, not FAIL), known_red (NG16/NG17/NG21), and
# NG15 may be BLOCKED if Android retains the summary flag on same-id updates.
# Each scenario line is a JSON object (valid YAML 1.2). Runner: notif_runner.py.
# NATIVE-Q (Kotlin queue/mask gate) is NOT a YAML scenario; runner reports it NOT_RUN/BLOCKED.
settings: {jev_pass_threshold: 0.8, default_sleep: 1.3}
seed: {transactions: []}
scenarios:
  - {"id": "NG01_child", "feature": "Single ungrouped child baseline", "nav": ["reset_app", "clear_notifications", {"tap_testid": "nav-transactions"}, {"sleep": 1}, {"post_notification": {"id": 101, "title": "OBI", "body": "1\u00a0599\u00a0Ft \u00f6sszeget fizett\u00e9l itt: OBI."}}, "launch", {"sleep": 2}, {"tap_testid": "nav-transactions"}, {"sleep": 1}, {"await_rows": {"expected": [{"title": "OBI", "body": "1\u00a0599\u00a0Ft \u00f6sszeget fizett\u00e9l itt: OBI.", "amount": 1599, "currency": "HUF"}], "timeout": 15, "stable_seconds": 3}}], "code_assert": {"url_endswith": "/transactions", "testid_present": ["nav-transactions"], "row_count": 1, "rows_equal": [{"title": "OBI", "body": "1\u00a0599\u00a0Ft \u00f6sszeget fizett\u00e9l itt: OBI.", "amount": 1599, "currency": "HUF"}], "no_empty_rows": true}, "jev_assert": [{"id": "expense_visible", "question": "Does the Transactions screen visibly show an OBI purchase for 1,599 HUF?", "true": "One OBI transaction row with 1599 HUF", "false": "No OBI transaction row or wrong displayed amount"}], "hint": "listener grant/poster permission; RevolutNotificationService.kt:96,115."}
